<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>BGL·RR — Report an Emergency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<div class="device">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Open settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <div class="submenu" id="submenu">
      <button class="submenu-item">Language</button>
      <button class="submenu-item">Account</button>
      <button class="submenu-item">Help</button>
      <button class="submenu-item">Log Out</button>
    </div>

    <div class="brand">BGL<span>·</span>RR</div>
    <div class="icon-btn" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>
    </div>
  </header>
  <main>
    <h1>What kind of emergency<br>will you report?</h1>

    <div class="grid">
      <button class="cat fire" data-cat="Fire">
        <span class="icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        </span>
        SUNOG
      </button>

      <button class="cat disaster" data-cat="Disaster">
        <span class="icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        </span>
        SAKUNA
      </button>

      <button class="cat crime" data-cat="Crime">
        <span class="icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="12" r="4"/>
          <circle cx="17" cy="12" r="4"/>
          <path d="M11 12h2"/>
          </svg>
        </span>
        KRIMEN
      </button>

      <button class="cat medical" data-cat="Medical">
        <span class="icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
          <line x1="12" y1="4" x2="12" y2="20"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          </svg>
        </span>
        MEDIKAL
      </button>

      <button class="cat missing-p" data-cat="Missing Person">
        <span class="icon-disc">
         <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="3"/>
          <path d="M4 20c0-3 2.5-5.5 5.5-5.5"/>
          <circle cx="16" cy="16" r="3.5"/>
          <line x1="18.5" y1="18.5" x2="21" y2="21"/>
          </svg>
        </span>
        NAWAWALANG<br>TAO
      </button>

      <button class="cat blotter" data-cat="Schedule Blotter">
        <span class="icon-disc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <path d="M2 13h20"/>
          </svg>
        </span>
        BLOTTER
      </button>

    <footer class="hint">Pindutin ang kategorya para maisimulan ang iyong report.</footer>
  </main>
</div>

<script src="script.js" defer></script>

</body>
</html>
